<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>综合日常 · 任务打卡（新版）</title>
  <!-- SheetJS 库，用于前端解析 xlsx -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    body {
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0.8rem;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 1.8rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.06);
      overflow: hidden;
      padding: 1.3rem 1rem 1.8rem;
      position: relative;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    h1 span {
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.8rem;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-weight: 500;
    }

    .date-badge-wrapper {
      position: relative;
      display: inline-block;
      margin: 0.4rem 0 0.8rem;
    }
    .date-badge {
      background: #f1f5f9;
      color: #475569;
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      border: 1.5px solid #e2e8f0;
      transition: all 0.2s;
      user-select: none;
    }
    .date-badge:hover {
      background: #e8edf3;
      border-color: #cbd5e1;
    }
    .date-badge:active {
      background: #dde3ea;
      transform: scale(0.97);
    }
    .calendar-icon {
      font-size: 0.9rem;
      margin-left: 0.15rem;
    }

    .calendar-dropdown {
      display: none;
      position: absolute;
      top: 110%;
      left: 0;
      z-index: 100;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 0.9rem;
      width: 280px;
      border: 1px solid #e9eef2;
    }
    .calendar-dropdown.active {
      display: block;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      font-weight: 600;
      color: #1e293b;
      font-size: 0.9rem;
    }
    .calendar-nav {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 50%;
      color: #4f46e5;
      transition: 0.15s;
    }
    .calendar-nav:hover {
      background: #eef2ff;
    }
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.7rem;
      color: #94a3b8;
      margin-bottom: 0.3rem;
      font-weight: 500;
    }
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }
    .calendar-day {
      padding: 0.4rem 0;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.75rem;
      transition: 0.15s;
      color: #334155;
    }
    .calendar-day:hover {
      background: #f1f5f9;
    }
    .calendar-day.today {
      background: #4f46e5;
      color: white;
      font-weight: 600;
    }
    .calendar-day.other-month {
      color: #cbd5e1;
      pointer-events: none;
    }
    .calendar-day:active {
      transform: scale(0.9);
    }

    .preview-section {
      background: #f8fafc;
      border-radius: 1rem;
      padding: 0.8rem;
      margin-bottom: 1.2rem;
      border: 1px solid #e9eef2;
    }
    .preview-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 0.6rem;
      font-weight: 600;
    }
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      white-space: nowrap;
      background: white;
      border-radius: 0.6rem;
      overflow: hidden;
      min-width: 280px;
    }
    th {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 600;
      padding: 0.5rem 0.3rem;
      text-align: center;
      border-bottom: 2px solid #e2e8f0;
      font-size: 0.7rem;
    }
    td {
      padding: 0.45rem 0.3rem;
      text-align: center;
      border-bottom: 1px solid #f1f5f9;
      color: #0f172a;
      font-size: 0.73rem;
    }
    .task-col {
      text-align: left;
      font-weight: 500;
      padding-left: 0.5rem;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mark-done {
      color: #16a34a;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .empty-cell {
      color: #cbd5e1;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 1rem 0 1.5rem;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #fff;
      border: 1.5px solid #e9eef2;
      border-radius: 0.9rem;
      padding: 0.7rem 0.9rem;
      transition: all 0.15s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .option-item:active {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .option-item.already-done {
      border-left: 3px solid #16a34a;
      background: #f0fdf4;
    }
    .radio-circle {
      width: 1.3rem;
      height: 1.3rem;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.15s;
    }
    .radio-circle.selected {
      border-color: #4f46e5;
    }
    .radio-circle.selected::after {
      content: '';
      width: 0.6rem;
      height: 0.6rem;
      background: #4f46e5;
      border-radius: 50%;
    }
    .option-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e293b;
      flex: 1;
    }
    .done-badge {
      font-size: 0.65rem;
      background: #dcfce7;
      color: #16a34a;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-weight: 500;
    }

    .submit-btn {
      background: #0f172a;
      color: white;
      border: none;
      border-radius: 2rem;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }
    .submit-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      transform: none;
    }
    .status-msg {
      text-align: center;
      margin-top: 0.7rem;
      font-size: 0.8rem;
      color: #64748b;
      min-height: 1.2rem;
    }
    .hidden-iframe {
      display: none;
    }
    .spinner {
      width: 0.9rem;
      height: 0.9rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <h1>🌱 综合日常<span>打卡</span></h1>

  <!-- 可点击展开日历的日期显示 -->
  <div class="date-badge-wrapper" id="dateBadgeWrapper">
    <div class="date-badge" id="dateBadge">
      📅 <span id="dateText">加载中...</span>
      <span class="calendar-icon">📆</span>
    </div>
    <div class="calendar-dropdown" id="calendarDropdown">
      <div class="calendar-header">
        <button class="calendar-nav" id="calPrev">◀</button>
        <span id="calMonthYear"></span>
        <button class="calendar-nav" id="calNext">▶</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-days" id="calendarDays"></div>
    </div>
  </div>

  <!-- 预览表 -->
  <div class="preview-section">
    <div class="preview-title">📋 近5天预览</div>
    <div class="table-wrapper">
      <table id="previewTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="previewLoading" style="text-align:center;padding:0.8rem;color:#94a3b8;font-size:0.8rem;">加载中...</div>
  </div>

  <!-- 选项列表 -->
  <div class="options-list" id="optionsContainer">
    <div style="color:#94a3b8;text-align:center;padding:0.8rem;">正在加载任务...</div>
  </div>

  <button class="submit-btn" id="submitBtn">
    <span id="btnText">提交</span>
  </button>
  <div class="status-msg" id="statusMsg"></div>
</div>

<iframe name="hiddenFrame" class="hidden-iframe" id="hiddenFrame"></iframe>

<script>
  (function() {
    // ===== 配置 =====
    // 替换成你在步骤 6 部署得到的新的 GAS Web 应用 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzXGLmTB1tFHvTtbvddOgOd9_69wzbNahgGBiwAi5OdkpHcNGHr_dNd-NrsLT51MYo0/exec";
    
    // 替换成你的 GitHub 仓库 raw 地址
    const XLSX_URL = 'https://raw.githubusercontent.com/Karamelts/Daily-Mission2/main/data/tasks.xlsx';
    
    let allTasks = [];
    let selectedTasks = new Set();
    let todayDoneTasks = new Set();
    let todayDateStr = '';
    
    const optionsContainer = document.getElementById('optionsContainer');
    const previewTable = document.getElementById('previewTable');
    const previewLoading = document.getElementById('previewLoading');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const statusMsg = document.getElementById('statusMsg');
    const dateText = document.getElementById('dateText');
    const hiddenFrame = document.getElementById('hiddenFrame');
    
    const dateBadge = document.getElementById('dateBadge');
    const calendarDropdown = document.getElementById('calendarDropdown');
    const calMonthYear = document.getElementById('calMonthYear');
    const calendarDays = document.getElementById('calendarDays');
    const calPrev = document.getElementById('calPrev');
    const calNext = document.getElementById('calNext');
    
    let calYear, calMonth;
    let realToday;

    // ===== GMT+8 凌晨4点规则：计算"有效今天" =====
    function getEffectiveToday() {
      const now = new Date();
      const utcH = now.getUTCHours();
      const utcD = now.getUTCDate();
      const utcM = now.getUTCMonth();
      const utcY = now.getUTCFullYear();
      
      let h = utcH + 8;
      let d = utcD;
      let m = utcM;
      let y = utcY;
      
      if (h >= 24) { h -= 24; d++; }
      if (h < 4) { d--; if (d <= 0) { m--; if (m < 0) { m = 11; y--; } d = new Date(y, m+1, 0).getDate(); } }
      
      return {
        date: new Date(y, m, d),
        dateStr: d.toString(),
        day: d,
        month: m,
        year: y,
        displayStr: `${d}/${m+1}/${y}`
      };
    }

    function updateDateDisplay() {
      const t = getEffectiveToday();
      realToday = t.date;
      todayDateStr = t.dateStr;
      dateText.textContent = t.displayStr + ' · 凌晨4点切换';
      calYear = t.year;
      calMonth = t.month;
    }

    // ===== 日历渲染 =====
    function renderCalendar() {
      const firstDay = new Date(calYear, calMonth, 1);
      const lastDay = new Date(calYear, calMonth + 1, 0);
      const startDayOfWeek = firstDay.getDay();
      const daysInMonth = lastDay.getDate();
      
      calMonthYear.textContent = `${calYear}年${calMonth + 1}月`;
      
      let html = '';
      for (let i = 0; i < startDayOfWeek; i++) {
        html += '<div></div>';
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const thisDate = new Date(calYear, calMonth, d);
        const isToday = realToday && thisDate.toDateString() === realToday.toDateString();
        let cls = 'calendar-day';
        if (isToday) cls += ' today';
        html += `<div class="${cls}" data-date="${d}">${d}</div>`;
      }
      calendarDays.innerHTML = html;
      
      calendarDays.querySelectorAll('.calendar-day').forEach(dayEl => {
        dayEl.addEventListener('click', (e) => {
          e.stopPropagation();
          const clickedDay = parseInt(dayEl.dataset.date);
          realToday = new Date(calYear, calMonth, clickedDay);
          const info = getEffectiveTodayForDate(realToday);
          todayDateStr = info.dateStr;
          dateText.textContent = info.displayStr + ' · 凌晨4点切换';
          calendarDropdown.classList.remove('active');
          fetchData();
          selectedTasks.clear();
        });
      });
    }

    function getEffectiveTodayForDate(d) {
      const y = d.getFullYear();
      const m = d.getMonth();
      const day = d.getDate();
      return {
        date: new Date(y, m, day),
        dateStr: day.toString(),
        day: day,
        month: m,
        year: y,
        displayStr: `${day}/${m+1}/${y}`
      };
    }

    calPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    });
    calNext.addEventListener('click', (e) => {
      e.stopPropagation();
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    });

    dateBadge.addEventListener('click', (e) => {
      e.stopPropagation();
      calendarDropdown.classList.toggle('active');
      if (calendarDropdown.classList.contains('active')) {
        calYear = realToday.getFullYear();
        calMonth = realToday.getMonth();
        renderCalendar();
      }
    });

    document.addEventListener('click', (e) => {
      if (!document.getElementById('dateBadgeWrapper').contains(e.target)) {
        calendarDropdown.classList.remove('active');
      }
    });

    // ===== 渲染选项列表 =====
    function renderOptions(tasks) {
      if (!tasks.length) {
        optionsContainer.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:0.8rem;">暂无任务</div>';
        return;
      }
      let html = '';
      tasks.forEach(t => {
        const sel = selectedTasks.has(t.label);
        const isDone = todayDoneTasks.has(t.label);
        let cls = 'option-item';
        if (isDone) cls += ' already-done';
        
        html += `<div class="${cls}" data-label="${escHtml(t.label)}">
          <div class="radio-circle${sel ? ' selected' : ''}"></div>
          <span class="option-label">${escHtml(t.label)}</span>
          ${isDone ? '<span class="done-badge">✓ 已完成</span>' : ''}
        </div>`;
      });
      optionsContainer.innerHTML = html;
      
      document.querySelectorAll('.option-item').forEach(item => {
        item.addEventListener('click', () => {
          const label = item.dataset.label;
          const circle = item.querySelector('.radio-circle');
          if (selectedTasks.has(label)) {
            selectedTasks.delete(label);
            circle.classList.remove('selected');
          } else {
            selectedTasks.add(label);
            circle.classList.add('selected');
          }
        });
      });
    }

    // ===== 渲染预览表 =====
    function renderPreview(data, tasks) {
      if (!data || !data.headers || data.headers.length < 2) {
        previewTable.innerHTML = '<thead><tr><th>任务</th></tr></thead><tbody><tr><td colspan="5">暂无数据</td></tr></tbody>';
        return;
      }
      const dateHeaders = data.headers.slice(1);
      let thead = '<tr><th>任务</th>';
      dateHeaders.forEach(d => { thead += `<th>${escHtml(d)}</th>`; });
      thead += '</tr>';
      
      todayDoneTasks.clear();
      
      let tbody = '';
      tasks.forEach(task => {
        tbody += '<tr>';
        tbody += `<td class="task-col">${escHtml(task.label)}</td>`;
        const row = data.rows.find(r => r.taskLabel === task.label);
        
        dateHeaders.forEach(ds => {
          const col = data.headerMap[ds];
          if (row && col && row[col] !== undefined && row[col] !== '') {
            const v = row[col];
            if (v === 1 || v === '1') {
              tbody += '<td class="mark-done">✓</td>';
              if (ds === todayDateStr) {
                todayDoneTasks.add(task.label);
              }
            } else {
              tbody += `<td>${escHtml(v.toString())}</td>`;
            }
          } else {
            tbody += '<td class="empty-cell">-</td>';
          }
        });
        tbody += '</tr>';
      });
      previewTable.innerHTML = `<thead>${thead}</thead><tbody>${tbody}</tbody>`;
    }

    function escHtml(s) {
      return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);
    }

    // ===== 从 GitHub 加载 xlsx 并解析 =====
    async function fetchData() {
      try {
        previewLoading.style.display = 'block';
        updateDateDisplay();
        
        // 加时间戳避免缓存
        const resp = await fetch(XLSX_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!resp.ok) throw new Error('xlsx 加载失败: ' + resp.status);
        
        const buffer = await resp.arrayBuffer();
        const wb = XLSX.read(buffer, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        
        // 第一行是表头：["任务", "25", "26", ...]
        const rawHeaders = rows[0].map(h => String(h).trim());
        const allDateHeaders = rawHeaders.slice(1);
        
        // 找今天所在列，取最近 5 天
        const todayIdx = allDateHeaders.lastIndexOf(todayDateStr);
        const startIdx = todayIdx >= 0 ? Math.max(0, todayIdx - 4) : Math.max(0, allDateHeaders.length - 5);
        const dateHeaders = allDateHeaders.slice(startIdx, todayIdx >= 0 ? todayIdx + 1 : undefined);
        
        const dataRows = rows.slice(1);
        
        // 任务列表
        const allTasks = [];
        dataRows.forEach(r => {
          const label = String(r[0] || '').trim();
          if (label) allTasks.push({ label });
        });
        
        // 构造 preview 行数据
        const previewRows = dataRows
          .filter(r => String(r[0] || '').trim())
          .map(r => {
            const obj = { taskLabel: String(r[0]).trim() };
            dateHeaders.forEach((ds) => {
              const colIndex = rawHeaders.indexOf(ds);
              obj[ds] = (colIndex >= 0 && r[colIndex] !== undefined) ? r[colIndex] : '';
            });
            return obj;
          });
        
        // headerMap：日期字符串 -> 日期字符串（因为 xlsx 列标题就是日期）
        const headerMap = {};
        dateHeaders.forEach(ds => {
          headerMap[ds] = ds;
        });
        
        const preview = {
          headers: ['任务', ...dateHeaders],
          rows: previewRows,
          headerMap: headerMap
        };
        
        renderPreview(preview, allTasks);
        renderOptions(allTasks);
      } catch (e) {
        statusMsg.textContent = '❌ 加载失败: ' + e.message;
      } finally {
        previewLoading.style.display = 'none';
      }
    }

    // ===== 提交（toggle 逻辑） =====
    function submit() {
      if (selectedTasks.size === 0) {
        statusMsg.textContent = '⚠️ 请至少选择一个任务';
        return;
      }
      
      const toMark = [];
      const toUnmark = [];
      
      selectedTasks.forEach(label => {
        if (todayDoneTasks.has(label)) {
          toUnmark.push(label);
        } else {
          toMark.push(label);
        }
      });
      
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = GAS_URL;
      form.target = 'hiddenFrame';
      
      const addField = (n, v) => {
        const inp = document.createElement('input');
        inp.type = 'hidden';
        inp.name = n;
        inp.value = v;
        form.appendChild(inp);
      };
      
      addField('action', 'submit');
      addField('dateStr', todayDateStr);
      addField('mark', JSON.stringify(toMark));
      addField('unmark', JSON.stringify(toUnmark));
      
      document.body.appendChild(form);
      
      hiddenFrame.onload = () => {
        try {
          const doc = hiddenFrame.contentDocument || hiddenFrame.contentWindow.document;
          const txt = (doc.body.innerText || '').trim();
          if (txt === 'success') {
            const doneCount = toMark.length;
            const undoCount = toUnmark.length;
            let msg = '✅ 提交成功！';
            if (doneCount > 0) msg += ` 新增${doneCount}项`;
            if (undoCount > 0) msg += ` 取消${undoCount}项`;
            statusMsg.textContent = msg + ' 正在同步静态文件...';
            selectedTasks.clear();
            // 等待 GitHub Action 完成同步后再刷新
            setTimeout(fetchData, 2500);
          } else {
            statusMsg.textContent = '⚠️ ' + txt.substring(0, 60);
          }
        } catch(e) {
          statusMsg.textContent = '✅ 已提交（等待同步）';
          selectedTasks.clear();
          setTimeout(fetchData, 2500);
        }
        submitBtn.disabled = false;
        btnText.textContent = '提交';
        document.body.removeChild(form);
      };
      
      submitBtn.disabled = true;
      btnText.textContent = '提交中...';
      statusMsg.textContent = '';
      form.submit();
      
      setTimeout(() => {
        if (submitBtn.disabled) {
          submitBtn.disabled = false;
          btnText.textContent = '提交';
          statusMsg.textContent = '⌛ 超时，请重试';
          if (document.body.contains(form)) document.body.removeChild(form);
        }
      }, 15000);
    }

    submitBtn.addEventListener('click', submit);
    
    // 初始化
    updateDateDisplay();
    fetchData();
  })();
</script>
